# Builds the Windows installer on GitHub and puts it under Releases.
# Runs when a version tag like v1.0.0 is pushed, or by hand (Actions tab -> Run workflow).
name: Build and release Peek AI

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: Peek AI v__VERSION__
          releaseBody: |
            **Download `Peek AI_x.x.x_x64-setup.exe` below and double-click it.**

            1. If Windows shows "Windows protected your PC", click **More info → Run anyway** (the app is not signed).
            2. Choose who to install for and the folder, then Install.
            3. Open Peek AI → ⚙ Settings → paste your own free API key (Groq or Gemini).

            Full guide: see the README.
          releaseDraft: false
          prerelease: false
