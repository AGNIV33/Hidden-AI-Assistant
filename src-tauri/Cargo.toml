[package]
name = "peek-ai"
description = "Peek AI - private AI helper hidden from screen share"
version = "1.0.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart"] }
cpal = "0.15"
tokio = { version = "1", features = ["time"] }
keyring = { version = "3", features = ["windows-native"] }
xcap = "0.9.8"
pdf-extract = "0.12.1"
base64 = "0.23.1"
tauri-plugin-autostart = "2.7.0"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
zip = { version = "9.2.2", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
