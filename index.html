<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Peek AI</title>
    <link rel="stylesheet" href="/src/styles.css" />
    <script>
      // Show any script error on screen, so problems are visible instead of "nothing works".
      (function () {
        function show(msg) {
          var b = document.getElementById("crash");
          if (!b) {
            b = document.createElement("div");
            b.id = "crash";
            b.style.cssText = "position:fixed;left:0;right:0;bottom:0;z-index:99999;padding:8px 12px;background:#7a1f2b;color:#fff;font:12px/1.4 Consolas,monospace;white-space:pre-wrap;max-height:40%;overflow:auto;user-select:text";
            (document.body || document.documentElement).appendChild(b);
          }
          b.textContent += "Error: " + msg + "\n";
        }
        window.addEventListener("error", function (e) { show(e.message + (e.filename ? " (" + e.filename.split("/").pop() + ":" + e.lineno + ")" : "")); });
        window.addEventListener("unhandledrejection", function (e) { show(String(e.reason && e.reason.message || e.reason)); });
      })();
    </script>
  </head>
  <body>
    <div id="panel">
      <header data-tauri-drag-region>
        <button class="sess" id="sessBtn" title="Sessions"><span id="sessName">Session 1</span><span class="caret">▾</span></button>
        <div class="actions">
          <button class="ib" id="protBtn" title="Hidden from screen share (click to change)"><svg class="eyeoff" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg><svg class="eye" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>
          <button class="ib" id="newBtn" title="New session">＋</button>
          <button class="ib" id="chatBtn" title="Chat"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></button>
          <button class="ib" id="listenBtn" title="Listen to the meeting"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
          <button class="ib" id="settingsBtn" title="Settings">⚙</button>
          <button class="ib" id="closeBtn" title="Close (the bubble comes back)">✕</button>
        </div>
      </header>

      <div id="exposedBar" hidden>⚠ VISIBLE in screen share. Click the eye to hide again.</div>
      <div id="chips"></div>
      <div id="live" hidden></div>

      <main id="chat"></main>

      <section id="sessions" hidden></section>
      <section id="settings" hidden></section>

      <div id="files" hidden></div>
      <div id="imgBar" hidden></div>
      <footer>
        <button class="ib" id="attachBtn" title="Add files for context (PDF, Word, text)"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg></button>
        <button class="ib" id="shotBtn" title="Screenshot and ask"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg></button>
        <button class="ib" id="snipBtn" title="Select an area of the screen and ask"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3"/></svg></button>
        <textarea id="input" rows="1" placeholder="Ask anything…"></textarea>
        <button class="send" id="sendBtn" title="Send">➤</button>
      </footer>
      <input type="file" id="filePick" multiple hidden accept=".pdf,.docx,.txt,.md,.markdown,.csv,.json,.log,.xml,.html,.htm,.yaml,.yml,.png,.jpg,.jpeg,.webp,.gif" />

      <div id="toast" hidden></div>
    </div>
    <script type="module" src="/src/panel.ts"></script>
  </body>
</html>
